<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 860" width="1065" height="860" role="img" aria-labelledby="t d">
  <title id="t">LeKiwi + SO-101 Wiring Diagram</title>
  <desc id="d">Power, USB and servo-bus connections between the Beelink mini PC, two motor controller boards, the LeKiwi base wheels, the SO-101 follower arm and the SO-101 leader arm.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2330; }
    .title { font-size: 24px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #5b6475; }
    .h { font-size: 15px; font-weight: 650; }
    .s { font-size: 12px; fill: #5b6475; }
    .tiny { font-size: 11px; fill: #5b6475; }
    .port { font-size: 10.5px; font-weight: 600; fill: #5b6475; letter-spacing: .3px; }
    .mono { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 11px; fill: #3b4252; }
    .id { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .glabel { font-size: 13px; font-weight: 700; letter-spacing: .6px; }
    .power { stroke: #d23b2f; stroke-width: 3; fill: none; }
    .usb { stroke: #2f6fdb; stroke-width: 3; fill: none; }
    .bus { stroke: #3b3f4a; stroke-width: 2.5; fill: none; }
    .psu { fill: #fff5f4; stroke: #e3a8a1; stroke-width: 1.5; }
    .pc { fill: #f1f5ff; stroke: #a9bdea; stroke-width: 1.5; }
    .board { fill: #f4f6f8; stroke: #b8c0cc; stroke-width: 1.5; }
    .servo { fill: #ffffff; stroke: #c9cfd8; stroke-width: 1.2; }
    .group { fill: none; stroke: #aab2bf; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .jack { fill: #ffffff; stroke: #7a8394; stroke-width: 1.3; }
    .v12 { fill: #fff1dc; } .v12t { font-size: 10.5px; font-weight: 700; fill: #9a5b00; }
    .v74 { fill: #e3f4e8; } .v74t { font-size: 10.5px; font-weight: 700; fill: #1f7a3d; }
  </style>

  <rect width="1065" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text class="title" x="20" y="44">LeKiwi + SO-101 Wiring Diagram</text>
  <text class="sub" x="20" y="68">Beelink mini PC (Ubuntu 24.04) · LeKiwi mobile base · SO-101 follower and leader arms</text>

  <!-- ============ Power supplies ============ -->
  <rect class="psu" x="137" y="100" width="200" height="54" rx="8"/>
  <text class="h" x="237" y="123" text-anchor="middle">12 V · 8 A Power Supply</text>
  <text class="s" x="237" y="142" text-anchor="middle">base wheels + follower arm</text>

  <rect class="psu" x="545" y="100" width="200" height="54" rx="8"/>
  <text class="h" x="645" y="123" text-anchor="middle">Beelink Power Adapter</text>
  <text class="s" x="645" y="142" text-anchor="middle">included with the PC</text>

  <rect class="psu" x="840" y="100" width="200" height="54" rx="8"/>
  <text class="h" x="940" y="123" text-anchor="middle">5 V Power Supply</text>
  <text class="s" x="940" y="142" text-anchor="middle">leader arm</text>

  <!-- Power wires -->
  <!-- 12 V with inline switch -->
  <path class="power" d="M237 154 V176"/>
  <path class="power" d="M237 204 V226"/>
  <circle cx="237" cy="178" r="3" fill="#d23b2f"/>
  <circle cx="237" cy="202" r="3" fill="#d23b2f"/>
  <path d="M237 202 L252 181" stroke="#d23b2f" stroke-width="3" stroke-linecap="round"/>
  <text class="s" x="226" y="194" text-anchor="end" style="font-weight:600;fill:#1d2330">Power switch</text>
  <text class="tiny" x="247" y="220">DC barrel jack</text>

  <path class="power" d="M645 154 V226"/>
  <text class="tiny" x="655" y="220">DC barrel jack</text>

  <path class="power" d="M940 154 V226"/>
  <text class="tiny" x="950" y="220">DC barrel jack</text>

  <!-- ============ Main units ============ -->
  <!-- Controller board A -->
  <rect class="board" x="20" y="230" width="435" height="90" rx="10"/>
  <rect class="jack" x="229" y="224" width="16" height="10" rx="2"/>
  <text class="h" x="237" y="266" text-anchor="middle">Motor Controller Board</text>
  <text class="s" x="237" y="285" text-anchor="middle">LeKiwi: base + follower arm</text>
  <text class="port" x="445" y="279" text-anchor="end">USB-C</text>
  <rect class="jack" x="451" y="268" width="10" height="14" rx="2"/>
  <rect class="jack" x="115" y="314" width="20" height="10" rx="2"/>
  <rect class="jack" x="340" y="314" width="20" height="10" rx="2"/>
  <text class="port" x="125" y="308" text-anchor="middle">SERVO BUS</text>
  <text class="port" x="350" y="308" text-anchor="middle">SERVO BUS</text>

  <!-- Beelink -->
  <rect class="pc" x="535" y="230" width="220" height="90" rx="10"/>
  <rect class="jack" x="637" y="224" width="16" height="10" rx="2"/>
  <text class="h" x="645" y="268" text-anchor="middle">Beelink Mini PC</text>
  <text class="s" x="645" y="287" text-anchor="middle">Ubuntu 24.04</text>
  <text class="port" x="545" y="279">USB-A</text>
  <text class="port" x="745" y="279" text-anchor="end">USB-A</text>
  <rect class="jack" x="529" y="268" width="10" height="14" rx="2"/>
  <rect class="jack" x="751" y="268" width="10" height="14" rx="2"/>

  <!-- Controller board B -->
  <rect class="board" x="835" y="230" width="210" height="90" rx="10"/>
  <rect class="jack" x="932" y="224" width="16" height="10" rx="2"/>
  <text class="h" x="940" y="266" text-anchor="middle">Motor Controller Board</text>
  <text class="s" x="940" y="285" text-anchor="middle">leader arm</text>
  <text class="port" x="845" y="279">USB-C</text>
  <rect class="jack" x="829" y="268" width="10" height="14" rx="2"/>
  <rect class="jack" x="930" y="314" width="20" height="10" rx="2"/>
  <text class="port" x="940" y="308" text-anchor="middle">SERVO BUS</text>

  <!-- USB wires -->
  <path class="usb" d="M461 275 H529"/>
  <text class="port" x="495" y="266" text-anchor="middle" style="fill:#2f6fdb">USB</text>
  <path class="usb" d="M761 275 H829"/>
  <text class="port" x="795" y="266" text-anchor="middle" style="fill:#2f6fdb">USB</text>

  <!-- ============ Servo chains ============ -->
  <!-- Base group -->
  <rect class="group" x="20" y="370" width="210" height="232" rx="10"/>
  <path class="bus" d="M125 324 V390"/>
  <g transform="translate(30 390)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">7</text>
    <text class="mono" x="38" y="25">left_wheel</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <path class="bus" d="M125 432 V446"/>
  <g transform="translate(30 446)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">8</text>
    <text class="mono" x="38" y="25">back_wheel</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <path class="bus" d="M125 488 V502"/>
  <g transform="translate(30 502)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">9</text>
    <text class="mono" x="38" y="25">right_wheel</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <text class="glabel" x="125" y="571" text-anchor="middle">LEKIWI BASE</text>
  <text class="tiny" x="125" y="588" text-anchor="middle">3 omni-wheel servos · IDs 7–9</text>

  <!-- Follower arm group -->
  <rect class="group" x="245" y="370" width="210" height="400" rx="10"/>
  <path class="bus" d="M350 324 V390"/>
  <g transform="translate(255 390)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">1</text>
    <text class="mono" x="38" y="25">shoulder_pan</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <path class="bus" d="M350 432 V446"/>
  <g transform="translate(255 446)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">2</text>
    <text class="mono" x="38" y="25">shoulder_lift</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <path class="bus" d="M350 488 V502"/>
  <g transform="translate(255 502)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">3</text>
    <text class="mono" x="38" y="25">elbow_flex</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <path class="bus" d="M350 544 V558"/>
  <g transform="translate(255 558)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">4</text>
    <text class="mono" x="38" y="25">wrist_flex</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <path class="bus" d="M350 600 V614"/>
  <g transform="translate(255 614)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">5</text>
    <text class="mono" x="38" y="25">wrist_roll</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <path class="bus" d="M350 656 V670"/>
  <g transform="translate(255 670)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">6</text>
    <text class="mono" x="38" y="25">gripper</text>
    <rect class="v12" x="142" y="12" width="40" height="18" rx="9"/><text class="v12t" x="162" y="25" text-anchor="middle">12 V</text>
  </g>
  <text class="glabel" x="350" y="739" text-anchor="middle">FOLLOWER ARM · SO-101</text>
  <text class="tiny" x="350" y="756" text-anchor="middle">mounted on LeKiwi · IDs 1–6</text>

  <!-- Leader arm group -->
  <rect class="group" x="835" y="370" width="210" height="400" rx="10"/>
  <path class="bus" d="M940 324 V390"/>
  <g transform="translate(845 390)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">1</text>
    <text class="mono" x="38" y="25">shoulder_pan</text>
    <rect class="v74" x="142" y="12" width="40" height="18" rx="9"/><text class="v74t" x="162" y="25" text-anchor="middle">7.4 V</text>
  </g>
  <path class="bus" d="M940 432 V446"/>
  <g transform="translate(845 446)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">2</text>
    <text class="mono" x="38" y="25">shoulder_lift</text>
    <rect class="v74" x="142" y="12" width="40" height="18" rx="9"/><text class="v74t" x="162" y="25" text-anchor="middle">7.4 V</text>
  </g>
  <path class="bus" d="M940 488 V502"/>
  <g transform="translate(845 502)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">3</text>
    <text class="mono" x="38" y="25">elbow_flex</text>
    <rect class="v74" x="142" y="12" width="40" height="18" rx="9"/><text class="v74t" x="162" y="25" text-anchor="middle">7.4 V</text>
  </g>
  <path class="bus" d="M940 544 V558"/>
  <g transform="translate(845 558)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">4</text>
    <text class="mono" x="38" y="25">wrist_flex</text>
    <rect class="v74" x="142" y="12" width="40" height="18" rx="9"/><text class="v74t" x="162" y="25" text-anchor="middle">7.4 V</text>
  </g>
  <path class="bus" d="M940 600 V614"/>
  <g transform="translate(845 614)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">5</text>
    <text class="mono" x="38" y="25">wrist_roll</text>
    <rect class="v74" x="142" y="12" width="40" height="18" rx="9"/><text class="v74t" x="162" y="25" text-anchor="middle">7.4 V</text>
  </g>
  <path class="bus" d="M940 656 V670"/>
  <g transform="translate(845 670)">
    <rect class="servo" width="190" height="42" rx="7"/>
    <circle cx="20" cy="21" r="11" fill="#3b3f4a"/><text class="id" x="20" y="25" text-anchor="middle">6</text>
    <text class="mono" x="38" y="25">gripper</text>
    <rect class="v74" x="142" y="12" width="40" height="18" rx="9"/><text class="v74t" x="162" y="25" text-anchor="middle">7.4 V</text>
  </g>
  <text class="glabel" x="940" y="739" text-anchor="middle">LEADER ARM · SO-101</text>
  <text class="tiny" x="940" y="756" text-anchor="middle">teleoperation input · IDs 1–6</text>

  <!-- ============ Legend + notes ============ -->
  <g transform="translate(485 390)">
    <text class="glabel" x="0" y="0">LEGEND</text>
    <path class="power" d="M0 24 H40"/><text class="s" x="52" y="28" style="fill:#1d2330">DC power</text>
    <path class="usb" d="M0 48 H40"/><text class="s" x="52" y="52" style="fill:#1d2330">USB data</text>
    <path class="bus" d="M0 72 H40"/><text class="s" x="52" y="76" style="fill:#1d2330">Servo bus (3-pin, daisy-chained)</text>
    <rect class="v12" x="0" y="88" width="40" height="18" rx="9"/><text class="v12t" x="20" y="101" text-anchor="middle">12 V</text>
    <text class="s" x="52" y="101" style="fill:#1d2330">12 V servo</text>
    <rect class="v74" x="0" y="114" width="40" height="18" rx="9"/><text class="v74t" x="20" y="127" text-anchor="middle">7.4 V</text>
    <text class="s" x="52" y="127" style="fill:#1d2330">7.4 V servo</text>

    <text class="glabel" x="0" y="176">NOTES</text>
    <text class="s" x="0" y="200" style="fill:#1d2330">1. Turn the switch off before you plug in</text>
    <text class="s" x="14" y="217" style="fill:#1d2330">or unplug any servo cable.</text>
    <text class="s" x="0" y="241" style="fill:#1d2330">2. Never connect the 12 V supply to the</text>
    <text class="s" x="14" y="258" style="fill:#1d2330">leader board: 7.4 V servos will be damaged.</text>
    <text class="s" x="0" y="282" style="fill:#1d2330">3. Servos on a bus can be chained in any order,</text>
    <text class="s" x="14" y="299" style="fill:#1d2330">but each needs a unique ID (set during motor setup).</text>
  </g>

  <!-- Footer -->
  <line x1="20" y1="800" x2="1045" y2="800" stroke="#e3e6eb"/>
  <text class="tiny" x="20" y="824">Servo names follow LeRobot’s LeKiwi / SO-101 configuration.</text>
</svg>
