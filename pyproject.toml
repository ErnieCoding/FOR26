[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lekiwi_sim"
version = "0.1.0"
description = "MuJoCo simulator of the LeKiwi robot for the course labs"
requires-python = ">=3.10"
dependencies = ["mujoco", "numpy"]

[tool.setuptools]
packages = ["lekiwi_sim"]
